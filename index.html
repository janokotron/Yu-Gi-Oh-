<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yu-Gi-Oh! Card Collection</title>

<style>

:root{
    --bg:#090b10;
    --panel:#11151d;
    --panel2:#171c25;
    --text:#f5f5f5;
    --muted:#9da5b4;
    --gold:#ffd54a;
    --blue:#42a5f5;
    --purple:#ab47bc;
    --red:#ef5350;
    --green:#66bb6a;
    --orange:#ff9800;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(circle at top,#202735 0,#090b10 45%);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(9,11,16,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #2a303b;
}

.header-content{
    max-width:1600px;
    margin:auto;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-symbol{
    width:50px;
    height:50px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd54a,#9b6500);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    box-shadow:0 0 25px rgba(255,213,74,.35);
}

.logo h1{
    font-size:24px;
}

.logo span{
    color:var(--gold);
}

/* STATS */

.stats{
    display:flex;
    gap:20px;
}

.stat{
    background:#141923;
    border:1px solid #292f3b;
    padding:9px 15px;
    border-radius:10px;
    text-align:center;
}

.stat strong{
    display:block;
    color:var(--gold);
    font-size:18px;
}

.stat small{
    color:var(--muted);
}

/* MAIN */

.container{
    max-width:1600px;
    margin:auto;
    padding:25px;
}

/* CONTROLS */

.controls{
    background:rgba(17,21,29,.95);
    border:1px solid #292f3b;
    border-radius:16px;
    padding:20px;
    margin-bottom:25px;
}

.search{
    width:100%;
    background:#090c12;
    border:1px solid #303744;
    color:white;
    padding:15px 18px;
    border-radius:10px;
    outline:none;
    font-size:16px;
    margin-bottom:18px;
}

.search:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(255,213,74,.12);
}

.filters{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(190px,1fr));
    gap:12px;
}

select{
    background:#0c1017;
    color:white;
    border:1px solid #303744;
    border-radius:9px;
    padding:12px;
    outline:none;
    cursor:pointer;
}

select:focus{
    border-color:var(--gold);
}

/* CATEGORY BUTTONS */

.categories{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.category{
    border:1px solid #303744;
    background:#111722;
    color:#dce1e8;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
    transition:.2s;
}

.category:hover,
.category.active{
    background:var(--gold);
    color:#111;
}

/* INFORMATION */

.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    color:var(--muted);
    gap:15px;
}

.info-bar strong{
    color:white;
}

/* GRID */

.card-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(210px,1fr));
    gap:22px;
}

/* CARD */

.card{
    background:#11151d;
    border:1px solid #2c323e;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    transition:
        transform .25s,
        box-shadow .25s,
        border-color .25s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-7px);
    border-color:var(--gold);
    box-shadow:
        0 15px 40px rgba(0,0,0,.55),
        0 0 20px rgba(255,213,74,.08);
}

.card-image-container{
    position:relative;
    background:#050608;
}

.card-image{
    width:100%;
    display:block;
    aspect-ratio:421/614;
    object-fit:cover;
}

.rarity{
    position:absolute;
    top:9px;
    right:9px;
    background:rgba(0,0,0,.85);
    border:1px solid var(--gold);
    color:var(--gold);
    padding:5px 8px;
    border-radius:7px;
    font-size:11px;
    font-weight:bold;
}

.stars{
    position:absolute;
    bottom:8px;
    left:8px;
    display:flex;
    gap:2px;
    flex-wrap:wrap;
}

.star{
    color:#ffd740;
    font-size:13px;
    text-shadow:0 0 5px #ff9800;
}

/* CARD CONTENT */

.card-content{
    padding:13px;
}

.card-name{
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:7px;
}

.card-type{
    color:#b8c0ce;
    font-size:12px;
    margin-bottom:10px;
}

.badges{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.badge{
    font-size:10px;
    padding:4px 7px;
    border-radius:5px;
    background:#252b35;
    color:#dfe4eb;
}

.badge.monster{
    background:#54321b;
    color:#ffbf69;
}

.badge.spell{
    background:#123e42;
    color:#6de7d7;
}

.badge.trap{
    background:#4b1b40;
    color:#ff8ee9;
}

.power{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
}

.atk{
    color:#ff706b;
}

.def{
    color:#62b5ff;
}

/* TYPE COLORS */

.card[data-main-type="Spell"]{
    border-top:3px solid #27a99a;
}

.card[data-main-type="Trap"]{
    border-top:3px solid #b84da4;
}

.card[data-main-type="Monster"]{
    border-top:3px solid #e0a52e;
}

/* LOADING */

.loading{
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
}

.loader{
    width:45px;
    height:45px;
    border:4px solid #272d37;
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 20px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.88);
    backdrop-filter:blur(10px);
    padding:30px;
    overflow:auto;
}

.modal.show{
    display:flex;
    justify-content:center;
    align-items:center;
}

.modal-box{
    max-width:1000px;
    width:100%;
    background:#11151d;
    border:1px solid #363d4b;
    border-radius:18px;
    padding:25px;
    position:relative;
    box-shadow:0 30px 100px #000;
}

.close{
    position:absolute;
    right:18px;
    top:14px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid #444;
    background:#1a1f29;
    color:white;
    font-size:22px;
    cursor:pointer;
    z-index:5;
}

.modal-content{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:30px;
}

.modal-image{
    width:100%;
    border-radius:8px;
    box-shadow:0 20px 50px #000;
}

.modal-info h2{
    font-size:28px;
    color:var(--gold);
    margin-bottom:10px;
}

.modal-type{
    color:#b5bdca;
    margin-bottom:20px;
}

.detail{
    background:#181d26;
    border:1px solid #2c333e;
    padding:13px;
    border-radius:9px;
    margin-bottom:10px;
}

.detail strong{
    color:#ffd54a;
}

.description{
    line-height:1.7;
    color:#d2d7df;
    margin-top:15px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:80px 20px;
    color:#9098a7;
}

.empty h2{
    color:white;
    margin-bottom:10px;
}

/* RESPONSIVE */

@media(max-width:800px){

    .header-content{
        flex-direction:column;
        align-items:flex-start;
    }

    .stats{
        width:100%;
        overflow:auto;
    }

    .stat{
        min-width:100px;
    }

    .card-grid{
        grid-template-columns:
            repeat(auto-fill,minmax(160px,1fr));
        gap:12px;
    }

    .modal-content{
        grid-template-columns:1fr;
    }

    .modal-image{
        max-width:280px;
        margin:auto;
    }

}

@media(max-width:450px){

    .container{
        padding:12px;
    }

    .card-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .card-content{
        padding:9px;
    }

    .card-name{
        font-size:13px;
    }

    .logo h1{
        font-size:19px;
    }

}

</style>
</head>

<body>

<header>

<div class="header-content">

    <div class="logo">

        <div class="logo-symbol">
            🃏
        </div>

        <div>
            <h1>Yu-Gi-Oh! <span>Card Collection</span></h1>
            <small>Colección digital de cartas</small>
        </div>

    </div>

    <div class="stats">

        <div class="stat">
            <strong id="totalCards">0</strong>
            <small>Cartas</small>
        </div>

        <div class="stat">
            <strong id="shownCards">0</strong>
            <small>Mostradas</small>
        </div>

    </div>

</div>

</header>


<main class="container">

<section class="controls">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Buscar carta por nombre..."
    >

    <div class="filters">

        <select id="sort">
            <option value="rarity-desc">
                💎 Más raras → más comunes
            </option>

            <option value="power-desc">
                ⚔️ Más poderosas → más débiles
            </option>

            <option value="power-asc">
                🛡️ Más débiles → más poderosas
            </option>

            <option value="level-desc">
                ⭐ Mayor nivel → menor nivel
            </option>

            <option value="level-asc">
                ⭐ Menor nivel → mayor nivel
            </option>

            <option value="name-asc">
                🔤 Nombre A → Z
            </option>

            <option value="name-desc">
                🔤 Nombre Z → A
            </option>

        </select>


        <select id="mainType">

            <option value="all">
                🃏 Todos los tipos
            </option>

            <option value="Monster">
                🟠 Monstruos
            </option>

            <option value="Spell">
                🟢 Hechizos
            </option>

            <option value="Trap">
                🟣 Trampas
            </option>

        </select>


        <select id="monsterType">

            <option value="all">
                🐉 Todos los tipos de monstruo
            </option>

        </select>


        <select id="rarity">

            <option value="all">
                💎 Todas las rarezas
            </option>

        </select>

    </div>


    <div class="categories">

        <button class="category active" data-filter="all">
            Todas
        </button>

        <button class="category" data-filter="Dragon">
            🐉 Dragón
        </button>

        <button class="category" data-filter="Warrior">
            ⚔️ Guerrero
        </button>

        <button class="category" data-filter="Spellcaster">
            🔮 Lanzador de Conjuros
        </button>

        <button class="category" data-filter="Beast">
            🐺 Bestia
        </button>

        <button class="category" data-filter="Machine">
            🤖 Máquina
        </button>

        <button class="category" data-filter="Zombie">
            🧟 Zombi
        </button>

        <button class="category" data-filter="Fiend">
            👿 Demonio
        </button>

        <button class="category" data-filter="Aqua">
            🌊 Aqua
        </button>

        <button class="category" data-filter="Pyro">
            🔥 Piro
        </button>

    </div>

</section>


<div class="info-bar">

    <div>
        Mostrando
        <strong id="resultCount">0</strong>
        cartas
    </div>

    <div id="status">
        Cargando colección...
    </div>

</div>


<section id="cards" class="card-grid">

    <div class="loading">

        <div class="loader"></div>

        <h2>Cargando cartas...</h2>

        <p>
            Obteniendo la colección de Yu-Gi-Oh!
        </p>

    </div>

</section>

</main>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <button class="close" onclick="closeModal()">
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script>

const API =
"https://db.ygoprodeck.com/api/v7/cardinfo.php";

let allCards = [];
let filteredCards = [];

let activeCategory = "all";


/* ==============================
   RAREZA
============================== */

const rarityWeight = {

    "Quarter Century Secret Rare": 100,
    "Prismatic Secret Rare": 98,
    "Ghost Rare": 97,
    "Starlight Rare": 96,
    "Collector's Rare": 95,
    "Platinum Secret Rare": 94,
    "Secret Rare": 90,
    "Premium Gold Rare": 88,
    "Ultimate Rare": 86,
    "Ultra Rare": 80,
    "Gold Rare": 75,
    "Gold Secret Rare": 74,
    "Rare": 60,
    "Super Rare": 50,
    "Common": 10

};


/* ==============================
   CARGAR CARTAS
============================== */

async function loadCards(){

    try{

        setStatus("Descargando colección...");

        const response =
            await fetch(API);

        if(!response.ok){
            throw new Error("No se pudo acceder a la API");
        }

        const data =
            await response.json();

        allCards =
            data.data || [];

        prepareFilters();

        document.getElementById("totalCards")
            .textContent =
            allCards.length.toLocaleString();

        applyFilters();

        setStatus("Colección cargada");

    }

    catch(error){

        console.error(error);

        document.getElementById("cards").innerHTML = `

            <div class="empty">

                <h2>⚠️ No se pudo cargar la colección</h2>

                <p>
                    Comprueba tu conexión a Internet
                    y vuelve a cargar la página.
                </p>

            </div>

        `;

        setStatus("Error al cargar");

    }

}


/* ==============================
   FILTROS
============================== */

function prepareFilters(){

    const rarities =
        new Set();

    const monsterTypes =
        new Set();

    allCards.forEach(card => {

        if(card.card_sets){

            card.card_sets.forEach(set => {

                if(set.set_rarity){
                    rarities.add(
                        set.set_rarity
                    );
                }

            });

        }

        if(card.race){

            monsterTypes.add(
                card.race
            );

        }

    });


    const raritySelect =
        document.getElementById("rarity");

    [...rarities]
        .sort()
        .forEach(rarity => {

            const option =
                document.createElement("option");

            option.value = rarity;

            option.textContent =
                rarity;

            raritySelect.appendChild(option);

        });


    const monsterSelect =
        document.getElementById("monsterType");

    [...monsterTypes]
        .sort()
        .forEach(type => {

            const option =
                document.createElement("option");

            option.value = type;

            option.textContent =
                type;

            monsterSelect.appendChild(option);

        });

}


/* ==============================
   OBTENER RAREZA
============================== */

function getRarity(card){

    if(!card.card_sets ||
       !card.card_sets.length){

        return "Common";

    }

    let best =
        card.card_sets[0].set_rarity ||
        "Common";

    let bestWeight =
        rarityWeight[best] || 0;


    card.card_sets.forEach(set => {

        const rarity =
            set.set_rarity ||
            "Common";

        const weight =
            rarityWeight[rarity] || 0;

        if(weight > bestWeight){

            best = rarity;

            bestWeight = weight;

        }

    });

    return best;

}


/* ==============================
   PODER
============================== */

function getPower(card){

    const atk =
        card.atk || 0;

    const def =
        card.def || 0;

    const level =
        card.level || 0;

    return (
        atk +
        def +
        (level * 500)
    );

}


/* ==============================
   NIVEL
============================== */

function getLevel(card){

    if(card.level)
        return card.level;

    if(card.linkval)
        return card.linkval;

    return 0;

}


/* ==============================
   FILTRAR
============================== */

function applyFilters(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const mainType =
        document.getElementById("mainType")
        .value;

    const monsterType =
        document.getElementById("monsterType")
        .value;

    const rarity =
        document.getElementById("rarity")
        .value;


    filteredCards =
        allCards.filter(card => {

            /* BUSQUEDA */

            if(
                search &&
                !card.name
                    .toLowerCase()
                    .includes(search)
            ){

                return false;

            }


            /* TIPO PRINCIPAL */

            if(
                mainType !== "all" &&
                card.type !== mainType
            ){

                return false;

            }


            /* TIPO MONSTRUO */

            if(
                monsterType !== "all" &&
                card.race !== monsterType
            ){

                return false;

            }


            /* RAREZA */

            if(rarity !== "all"){

                const cardRarity =
                    card.card_sets
                    ?.some(
                        set =>
                        set.set_rarity === rarity
                    );

                if(!cardRarity)
                    return false;

            }


            /* CATEGORÍA */

            if(activeCategory !== "all"){

                if(card.race !== activeCategory)
                    return false;

            }


            return true;

        });


    sortCards();

}


/* ==============================
   ORDENAR
============================== */

function sortCards(){

    const sort =
        document.getElementById("sort")
        .value;


    filteredCards.sort((a,b) => {

        switch(sort){

            case "rarity-desc":

                return (
                    (rarityWeight[getRarity(b)] || 0)
                    -
                    (rarityWeight[getRarity(a)] || 0)
                );


            case "power-desc":

                return (
                    getPower(b)
                    -
                    getPower(a)
                );


            case "power-asc":

                return (
                    getPower(a)
                    -
                    getPower(b)
                );


            case "level-desc":

                return (
                    getLevel(b)
                    -
                    getLevel(a)
                );


            case "level-asc":

                return (
                    getLevel(a)
                    -
                    getLevel(b)
                );


            case "name-asc":

                return a.name.localeCompare(
                    b.name
                );


            case "name-desc":

                return b.name.localeCompare(
                    a.name
                );

        }

    });


    renderCards();

}


/* ==============================
   RENDERIZAR
============================== */

function renderCards(){

    const container =
        document.getElementById("cards");

    document.getElementById("resultCount")
        .textContent =
        filteredCards.length.toLocaleString();

    document.getElementById("shownCards")
        .textContent =
        filteredCards.length.toLocaleString();


    if(!filteredCards.length){

        container.innerHTML = `

            <div class="empty">

                <h2>🔎 No se encontraron cartas</h2>

                <p>
                    Prueba con otro filtro o búsqueda.
                </p>

            </div>

        `;

        return;

    }


    /*
       Para evitar que el navegador tenga
       que renderizar miles de cartas
       simultáneamente mostramos una cantidad
       inicial y cargamos más al hacer scroll.
    */

    const visible =
        filteredCards.slice(
            0,
            currentLimit
        );


    container.innerHTML =
        visible.map(createCard).join("");

}


/* ==============================
   LÍMITE DE CARTAS
============================== */

let currentLimit = 100;


window.addEventListener(
    "scroll",
    () => {

        if(
            window.innerHeight +
            window.scrollY >=
            document.body.offsetHeight - 1000
        ){

            if(
                currentLimit <
                filteredCards.length
            ){

                currentLimit += 100;

                renderCards();

            }

        }

    }
);


/* ==============================
   CREAR CARTA
============================== */

function createCard(card){

    const rarity =
        getRarity(card);

    const level =
        getLevel(card);

    const power =
        getPower(card);


    let stars = "";

    if(level > 0){

        const number =
            Math.min(level,13);

        stars =
            Array(number)
            .fill(
                '<span class="star">★</span>'
            )
            .join("");

    }


    let badges = "";


    if(card.type){

        if(card.type === "Spell"){

            badges += `
                <span class="badge spell">
                    HECHIZO
                </span>
            `;

        }
        else if(card.type === "Trap"){

            badges += `
                <span class="badge trap">
                    TRAMPA
                </span>
            `;

        }
        else{

            badges += `
                <span class="badge monster">
                    MONSTRUO
                </span>
            `;

        }

    }


    if(card.race){

        badges += `
            <span class="badge">
                ${escapeHTML(card.race)}
            </span>
        `;

    }


    if(card.attribute){

        badges += `
            <span class="badge">
                ${escapeHTML(card.attribute)}
            </span>
        `;

    }


    const atk =
        card.atk !== undefined
        ? card.atk
        : "—";

    const def =
        card.def !== undefined
        ? card.def
        : "—";


    return `

        <article
            class="card"
            data-main-type="${escapeHTML(card.type || "")}"
            onclick="openModal(${card.id})"
        >

            <div class="card-image-container">

                <img
                    class="card-image"
                    src="${card.card_images?.[0]?.image_url || ""}"
                    alt="${escapeHTML(card.name)}"
                    loading="lazy"
                >

                <div class="rarity">
                    💎 ${escapeHTML(rarity)}
                </div>

                <div class="stars">
                    ${stars}
                </div>

            </div>


            <div class="card-content">

                <div
                    class="card-name"
                    title="${escapeHTML(card.name)}"
                >
                    ${escapeHTML(card.name)}
                </div>

                <div class="card-type">
                    ${escapeHTML(card.type || "")}
                </div>

                <div class="badges">
                    ${badges}
                </div>

                <div class="power">

                    <span class="atk">
                        ATK ${atk}
                    </span>

                    <span class="def">
                        DEF ${def}
                    </span>

                </div>

            </div>

        </article>

    `;

}


/* ==============================
   MODAL
============================== */

function openModal(id){

    const card =
        allCards.find(
            c => c.id === id
        );

    if(!card)
        return;


    const rarity =
        getRarity(card);

    const level =
        getLevel(card);


    let stars = "";

    if(level > 0){

        stars =
            Array(Math.min(level,13))
            .fill("★")
            .join("");

    }


    const atk =
        card.atk ?? "—";

    const def =
        card.def ?? "—";


    const sets =
        card.card_sets
        ?.slice(0,10)
        .map(
            set =>
            `<div>
                ${escapeHTML(set.set_name)}
                —
                ${escapeHTML(set.set_rarity)}
            </div>`
        )
        .join("")
        ||
        "Sin información";


    document.getElementById(
        "modalContent"
    ).innerHTML = `

        <div class="modal-content">

            <div>

                <img
                    class="modal-image"
                    src="${card.card_images?.[0]?.image_url || ""}"
                    alt="${escapeHTML(card.name)}"
                >

            </div>


            <div class="modal-info">

                <h2>
                    ${escapeHTML(card.name)}
                </h2>

                <div class="modal-type">
                    ${escapeHTML(card.type || "")}
                </div>


                <div class="detail">

                    <strong>Rareza:</strong>

                    💎 ${escapeHTML(rarity)}

                </div>


                <div class="detail">

                    <strong>Tipo:</strong>

                    ${escapeHTML(card.race || "—")}

                </div>


                <div class="detail">

                    <strong>Atributo:</strong>

                    ${escapeHTML(card.attribute || "—")}

                </div>


                <div class="detail">

                    <strong>Nivel:</strong>

                    ${level > 0
                        ? stars + " " + level
                        : "—"
                    }

                </div>


                <div class="detail">

                    <strong>ATK:</strong>

                    ${atk}

                    &nbsp;&nbsp;&nbsp;

                    <strong>DEF:</strong>

                    ${def}

                </div>


                ${
                    card.linkval
                    ?
                    `
                    <div class="detail">
                        <strong>Link:</strong>
                        ${card.linkval}
                    </div>
                    `
                    :
                    ""
                }


                <div class="description">

                    <strong>Descripción</strong>

                    <br><br>

                    ${escapeHTML(
                        card.desc ||
                        "Sin descripción"
                    )}

                </div>


                <br>

                <div class="detail">

                    <strong>
                        Apariciones / rarezas
                    </strong>

                    <br><br>

                    ${sets}

                </div>

            </div>

        </div>

    `;


    document.getElementById("modal")
        .classList.add("show");

    document.body.style.overflow =
        "hidden";

}


function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

    document.body.style.overflow =
        "";

}


document.getElementById("modal")
    .addEventListener(
        "click",
        function(e){

            if(e.target === this)
                closeModal();

        }
    );


document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape")
            closeModal();

    }
);

/* ==============================
   SEGURIDAD HTML
============================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
